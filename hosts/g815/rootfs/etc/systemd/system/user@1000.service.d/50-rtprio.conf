# formalwm's event loop thread asks for SCHED_RR 1 (ShojiWM priority.rs) so a nice-0 build
# does not queue ahead of input and frames; under scx_bpfland a lower nice value gives it
# almost nothing. The session runs under this lingering manager, which takes its limits when
# it starts at boot, so limits.d and a fresh login never reach it.
# g815 only: on e1504g Mesa renders through a driver thread inside the compositor, which an RR
# event loop thread can hold off the CPU, and that was not measured.
[Service]
LimitRTPRIO=1
