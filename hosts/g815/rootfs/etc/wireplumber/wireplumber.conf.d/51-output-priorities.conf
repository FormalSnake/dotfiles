{
  "monitor.bluez.rules": [
    {
      "matches": [
        {
          "node.name": "~bluez_output.2C_BE_EE_65_A0_21.*"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 2000,
          "priority.driver": 2000
        }
      }
    },
    {
      "matches": [
        {
          "device.name": "bluez_card.14_14_7D_E7_8C_E3"
        }
      ],
      "actions": {
        "update-props": {
          "device.profile": "a2dp-sink",
          "bluez5.auto-connect": [
            "a2dp_sink"
          ]
        }
      }
    },
    {
      "matches": [
        {
          "node.name": "~bluez_output.14_14_7D_E7_8C_E3.*"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 2000,
          "priority.driver": 2000
        }
      }
    }
  ],
  "monitor.alsa.rules": [
    {
      "matches": [
        {
          "node.name": "~alsa_output.pci-0000_02_00.1.*"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 1500,
          "priority.driver": 1500
        }
      }
    },
    {
      "matches": [
        {
          "node.name": "~alsa_output.pci-0000_80_1f.3.*"
        }
      ],
      "actions": {
        "update-props": {
          "priority.session": 1000,
          "priority.driver": 1000
        }
      }
    }
  ]
}
