[general]
renice=10
softrealtime=auto
inhibit_screensaver=1

# gamemode pins games to the P-cores on Intel hybrid CPUs by default. BeamNG's traffic spawns
# more physics threads than the 275HX has P-cores, so they queue on 8 cores while 16 E-cores idle.
[cpu]
pin_cores=no

[custom]
start=notify-send -a GameMode "GameMode on"
end=notify-send -a GameMode "GameMode off"
