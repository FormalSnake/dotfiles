<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Geist Serif's Heart, Square and Triangle cuts also name themselves "Geist Serif" Regular, so serif could land on one. -->
  <match target="scan">
    <test name="family" qual="any"><string>Geist Serif Heart</string></test>
    <edit name="family" mode="assign_replace"><string>Geist Serif Heart</string></edit>
    <edit name="style" mode="assign_replace"><string>Heart</string></edit>
  </match>
  <match target="scan">
    <test name="family" qual="any"><string>Geist Serif Square</string></test>
    <edit name="family" mode="assign_replace"><string>Geist Serif Square</string></edit>
    <edit name="style" mode="assign_replace"><string>Square</string></edit>
  </match>
  <match target="scan">
    <test name="family" qual="any"><string>Geist Serif Triangle</string></test>
    <edit name="family" mode="assign_replace"><string>Geist Serif Triangle</string></edit>
    <edit name="style" mode="assign_replace"><string>Triangle</string></edit>
  </match>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Geist</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Geist Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Geist Mono</family><family>GeistMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
