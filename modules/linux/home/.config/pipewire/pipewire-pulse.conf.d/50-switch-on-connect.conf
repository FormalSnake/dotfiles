# A USB or Bluetooth output or input becomes the default the moment it
# connects; the module never switches to a built-in (PCI) device. A Bluetooth
# headset's mic and an HDMI sink (a monitor waking up) are left out, so the
# dedicated mic keeps the input and a screen never takes the output.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect blocklist=^bluez_input\\.|hdmi" }
]
