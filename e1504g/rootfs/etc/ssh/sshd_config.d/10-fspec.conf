PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
# A client that vanished without closing the connection (a laptop lid, a dropped Wi-Fi) is
# dropped after two minutes, which hangs up its session, a remote fspec apply included.
ClientAliveInterval 30
ClientAliveCountMax 4
