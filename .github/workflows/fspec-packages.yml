name: fspec packages

on:
  push:
    branches: [main]
    paths: ["fspec.lock", "patches/**"]
  pull_request:
    paths: ["fspec.lock", "patches/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.pkg }} (${{ matrix.platform }})
    # Builds the nightly lock update before it merges, so the cache holds its artifacts. Other
    # pull requests run without package write access.
    if: github.event_name != 'pull_request' || github.head_ref == 'fspec/update-lock'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ananicy-cpp, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: ancs4linux, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: clipssh, platform: aarch64-darwin, runner: macos-26 }
          - { pkg: clipssh, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: colloid-icon-theme, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: fast, platform: aarch64-darwin, runner: macos-26 }
          - { pkg: fast, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: fetch, platform: aarch64-darwin, runner: macos-26 }
          - { pkg: fetch, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: formalmusic, platform: aarch64-darwin, runner: macos-26 }
          - { pkg: formalmusic, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: formalos-chime, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: formalshell, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: fspec, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: kopuzd, platform: aarch64-darwin, runner: macos-26 }
          - { pkg: kopuzd, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: librepods, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: lumen, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: meshtop, platform: aarch64-darwin, runner: macos-26 }
          - { pkg: meshtop, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: messages, platform: aarch64-darwin, runner: macos-26 }
          - { pkg: messages, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: nil, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: pam_ssh_agent_auth, platform: aarch64-darwin, runner: macos-26 }
          - { pkg: tmux-agent-sidebar, platform: aarch64-darwin, runner: macos-26 }
          - { pkg: uxplay, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: wl-clip-persist, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: wl-gammarelay-rs, platform: x86_64-linux, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - name: Install fspec
        run: cargo install --locked --git https://github.com/FormalStudio/formalspec fspec
      - name: Build
        env:
          # GITHUB_TOKEN reads only this repository; a git(...) source in another private one needs this.
          FSPEC_GIT_TOKEN: ${{ secrets.FSPEC_GIT_TOKEN }}
        run: |
          if [ -n "$FSPEC_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:$FSPEC_GIT_TOKEN@github.com/".insteadOf https://github.com/
          fi
          fspec --spec spec.star build --pkg ${{ matrix.pkg }} --platform ${{ matrix.platform }} --out out
      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "$TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd out
          oras push "ghcr.io/$owner/fspec-cache/${{ matrix.pkg }}:$(cat tag)" \
            "${{ matrix.pkg }}-${{ matrix.platform }}.tar.zst:application/vnd.fspec.package.v1.tar+zstd"

  record:
    # Without the digests in the lock a host compiles what CI already built. A push made with
    # GITHUB_TOKEN starts no workflow, so this commit does not rebuild the cache.
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency: fspec-record
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oras-project/setup-oras@v1
      - name: Install fspec
        run: cargo install --locked --git https://github.com/FormalStudio/formalspec fspec
      - name: Record the digests
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          # A failed build leaves its tag missing and the command failing; the digests that did
          # resolve are still saved.
          fspec --spec spec.star update --cache || true
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: record the cache digests"
          file_pattern: fspec.lock
          branch: main
