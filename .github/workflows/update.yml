# Weekly flake.lock bump, replacing the on-device `nix flake update` that
# scripts/nix-weekly-update.sh used to run. The lock lands on main only after
# every host evals against it; the hosts then pull and rebuild on their own
# schedule (the macbook's launchd job, manual rebuilds elsewhere).
#
# Direct push instead of a PR: PRs opened with the workflow GITHUB_TOKEN never
# trigger CI, so gating them on checks would need a PAT secret. The eval jobs
# run inside this same workflow instead, no secret required.
name: update

on:
  schedule:
    # Saturday 08:00 UTC, two hours before the macbook's 10:00 Canary-time
    # pull job (modules/darwin/mixins/auto-update.nix).
    - cron: "0 8 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - id: bump
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flake.lock: weekly input update" -- flake.lock
          git push --force origin HEAD:auto/flake-lock

  eval-nixos:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [g815, e1504g]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/flake-lock
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --dry-run

  eval-darwin:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/flake-lock
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build ".#darwinConfigurations.macbook.config.system.build.toplevel" --dry-run

  promote:
    needs: [update, eval-nixos, eval-darwin]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/flake-lock
          fetch-depth: 0
      - run: |
          git push origin HEAD:main
          git push origin :auto/flake-lock
