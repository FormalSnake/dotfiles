# The one CI job, weekly: bump flake.lock, eval every host against the
# result, and push the lock to main only when all three pass. The eval jobs
# run even when no input changed, so the week's pushes to main get checked
# too. `nix build --dry-run` forces the full module eval without building the
# closure; full builds would blow past the job clock (quickshell, herdr and
# t3code build from source against our nixpkgs pin).
#
# Direct push instead of a PR: PRs opened with the workflow GITHUB_TOKEN never
# trigger CI, so gating them on checks would need a PAT secret. The eval jobs
# run inside this same workflow instead, no secret required.
name: update

on:
  schedule:
    # Saturday 08:00 UTC, two hours before the macbook's 10:00 Canary-time
    # pull job (modules/darwin/mixins/auto-update.nix).
    - cron: "0 8 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - id: bump
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "flake.lock: weekly input update" -- flake.lock
          fi
          # Always published, so the eval jobs check main itself on a
          # no-change week.
          git push --force origin HEAD:auto/flake-lock

  eval-nixos:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [g815, e1504g]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: auto/flake-lock
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --dry-run

  eval-darwin:
    needs: update
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: auto/flake-lock
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build ".#darwinConfigurations.macbook.config.system.build.toplevel" --dry-run

  promote:
    needs: [update, eval-nixos, eval-darwin]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: auto/flake-lock
          fetch-depth: 0
      - run: |
          git push origin HEAD:main
          git push origin :auto/flake-lock
