# Eval-checks every host config. `nix build --dry-run` forces the full module
# eval (same depth as a real build, minus building the closure). Full builds
# don't fit here: quickshell, herdr and t3code build from source against our
# nixpkgs pin and would blow past the job clock and the 10 GB actions cache.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nixos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [g815, e1504g]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --dry-run

  darwin:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build ".#darwinConfigurations.macbook.config.system.build.toplevel" --dry-run
